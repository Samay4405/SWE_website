    <circle cx="950" cy="250" r="12" fill="#FFFFFF" />
    <line x1="810" y1="250" x2="680" y2="180" />
    <line x1="950" y1="390" x2="890" y2="480" />
    <line x1="950" y1="110" x2="1080" y2="80" />
    <circle cx="680" cy="180" r="8" fill="#6B5CFF" />
    <circle cx="890" cy="480" r="8" fill="#6B5CFF" />
    <circle cx="1080" cy="80" r="8" fill="#6B5CFF" />
  </g>
  
  <!-- Content overlay -->
