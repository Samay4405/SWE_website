<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120D2C" />
      <stop offset="50%" stop-color="#241B5C" />
      <stop offset="100%" stop-color="#4A3AFF" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  
  <!-- Abstract Circuit / AI Network -->
  <g stroke="#6B5CFF" stroke-width="2" stroke-opacity="0.5">
    <circle cx="950" cy="250" r="140" stroke-dasharray="8 6" />
