<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-cloud)" />
  
  <!-- Terminal window graphic right side -->
  <rect x="720" y="140" width="420" height="340" rx="8" fill="#020617" stroke="#475569" stroke-width="1.5" />
  <circle cx="750" cy="165" r="5" fill="#EF4444" />
  <circle cx="770" cy="165" r="5" fill="#EAB308" />
  <circle cx="790" cy="165" r="5" fill="#22C55E" />
  <line x1="720" y1="190" x2="1140" y2="190" stroke="#334155" stroke-width="1" />
  
  <text x="750" y="235" fill="#38BDF8" font-family="monospace" font-size="16">$ kubectl get nodes</text>
  <text x="750" y="270" fill="#94A3B8" font-family="monospace" font-size="14">NAME       STATUS   ROLES           AGE</text>
  <text x="750" y="295" fill="#4ADE80" font-family="monospace" font-size="14">node-01    Ready    control-plane   24d</text>
  <text x="750" y="320" fill="#4ADE80" font-family="monospace" font-size="14">node-02    Ready    worker          24d</text>
  <text x="750" y="365" fill="#38BDF8" font-family="monospace" font-size="16">$ helm install swe-app ./chart</text>
  <text x="750" y="400" fill="#E2E8F0" font-family="monospace" font-size="14">DEPLOYED: swe-app-production</text>

  <g font-family="system-ui, sans-serif">
    <rect x="80" y="80" width="120" height="32" rx="16" fill="#0284C7" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.2" />
    <text x="140" y="101" fill="#FFFFFF" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">WORKSHOP</text>
    
    <text x="80" y="240" fill="#FFFFFF" font-size="44" font-weight="800" letter-spacing="-1">Cloud-Native Architecture</text>
    <text x="80" y="295" fill="#93C5FD" font-size="28" font-weight="500">&amp; Kubernetes Intensive</text>
    
    <text x="80" y="480" fill="#94A3B8" font-size="18" font-family="monospace">HANDS-ON DOCKER + K8S + GITOPS</text>
    <text x="80" y="520" fill="#CBD5E1" font-size="16">📍 Computing Lab 4, Chanakya • 6-Hour Intensive</text>
  </g>
</svg>
